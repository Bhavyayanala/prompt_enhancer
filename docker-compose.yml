name: prompt-enhancer

services:
  backend:
    build:
      context: ./backend
    image: prompt-enhancer-backend:1.0
    container_name: prompt-enhancer-backend
    # The API key reaches the container only at runtime, from .env (never baked into the image).
    env_file:
      - .env
    environment:
      PORT: "4000"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same origin; nginx proxies /api to the backend service.
        VITE_API_URL: ""
    image: prompt-enhancer-frontend:1.0
    container_name: prompt-enhancer-frontend
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
