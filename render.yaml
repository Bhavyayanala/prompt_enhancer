# Render blueprint for the backend (Dashboard -> New -> Blueprint, or create a Web Service with the same settings).
services:
  - type: web
    name: prompt-enhancer-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # set the value in the Render dashboard, never in git
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: AI_TIMEOUT_MS
        value: "60000"
      - key: CORS_ORIGIN
        sync: false # e.g. https://your-app.vercel.app
